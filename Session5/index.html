<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DevKey — Web Dev Cheat Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="p-4 sm:p-8">
  <!-- Dark Mode Toggle -->
  <button id="darkModeToggle" class="fixed top-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg hover:bg-gray-700 transition">🌙</button>

  <header class="max-w-4xl mx-auto text-center mb-6">
    <h1 class="text-3xl sm:text-4xl font-extrabold">DevKey — Web Dev Cheat Sheet</h1>
    <p class="mt-2 text-sm text-gray-600">Quick reference for common HTML, CSS, and JavaScript keywords — searchable, filterable, and expandable.</p>

    <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4">
      <input id="searchInput" type="text" placeholder="Search keywords or descriptions — press '/' to focus" class="w-full sm:w-96 p-3 rounded-full border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <div class="filters flex gap-2" role="tablist" aria-label="Filter by category">
        <button data-cat="all" class="px-4 py-2 bg-gray-500 text-white rounded-full">All</button>
        <button data-cat="html" class="px-4 py-2 bg-blue-500 text-white rounded-full">HTML</button>
        <button data-cat="css" class="px-4 py-2 bg-green-500 text-white rounded-full">CSS</button>
        <button data-cat="js" class="px-4 py-2 bg-yellow-400 text-black rounded-full">JS</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="card p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold border-b-4 border-blue-500 pb-3 mb-4">HTML</h2>
        <div id="htmlList" class="space-y-4 scroll-container max-h-[65vh] overflow-y-auto"></div>
      </section>

      <section class="card p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold border-b-4 border-green-500 pb-3 mb-4">CSS</h2>
        <div id="cssList" class="space-y-4 scroll-container max-h-[65vh] overflow-y-auto"></div>
      </section>

      <section class="card p-6 rounded-2xl shadow-lg">
        <h2 class="text-xl font-bold border-b-4 border-yellow-500 pb-3 mb-4">JavaScript</h2>
        <div id="jsList" class="space-y-4 scroll-container max-h-[65vh] overflow-y-auto"></div>
      </section>
    </div>
  </main>

  <div id="tooltip" class="hidden absolute bg-gray-900 text-white p-2 rounded shadow-lg text-sm z-50"></div>

  <script src="script.js"></script>
</body>
</html>
