<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Keyword Reference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center p-4 sm:p-8">

    <!-- Header Section -->
    <header class="text-center mb-8 w-full max-w-4xl">
        <h1 class="text-3xl sm:text-5xl font-extrabold text-gray-900 leading-tight tracking-tight">
            Web Dev Keyword Reference
        </h1>
        <p class="mt-2 text-lg text-gray-600">
            Explore and learn essential keywords for HTML, CSS, and JavaScript.
        </p>
        <div class="mt-6">
            <input type="text" id="searchInput" placeholder="Search for a keyword..." class="w-full max-w-lg p-3 rounded-full border border-gray-300 shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-5xl">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="bg-white p-6 rounded-2xl shadow-lg transition-all duration-300 transform">
                <h2 class="text-2xl font-bold text-gray-800 border-b-4 border-blue-500 pb-3 mb-4">HTML Keywords</h2>
                <div id="htmlList" class="scroll-container space-y-4"></div>
            </section>

            <section class="bg-white p-6 rounded-2xl shadow-lg transition-all duration-300 transform">
                <h2 class="text-2xl font-bold text-gray-800 border-b-4 border-green-500 pb-3 mb-4">CSS Keywords</h2>
                <div id="cssList" class="scroll-container space-y-4"></div>
            </section>

            <section class="bg-white p-6 rounded-2xl shadow-lg transition-all duration-300 transform">
                <h2 class="text-2xl font-bold text-gray-800 border-b-4 border-yellow-500 pb-3 mb-4">JavaScript Keywords</h2>
                <div id="jsList" class="scroll-container space-y-4"></div>
            </section>
        </div>
    </main>

</body>
</html>
